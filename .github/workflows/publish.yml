# Publishes devzy to npm when a version tag (vX.Y.Z or vX.Y.Z-pre) is pushed.
# Authentication uses npm Trusted Publishing (OIDC); no npm token is stored.
# One-time setup: see RELEASING.md ("One-time setup (maintainer)").
name: Publish

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify, test and pack the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Validate tag, version and package metadata
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/release-check.ts "$TAG"

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Audit dependencies (moderate and above)
        run: bun audit --audit-level=moderate

      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

      - name: Build and check package contents
        run: bun run pack:check

      - name: Pack tarball
        id: pack
        run: |
          mkdir -p package
          npm pack --ignore-scripts --pack-destination package
          tarball=$(ls package/*.tgz)
          echo "tarball=$(basename "$tarball")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$tarball" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the exact tarball on Node 22
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: bun scripts/smoke.ts "package/$TARBALL"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: package/*.tgz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) and provenance
    env:
      TARBALL: ${{ needs.verify.outputs.tarball }}
      SHA256: ${{ needs.verify.outputs.sha256 }}
      VERSION: ${{ needs.verify.outputs.version }}
      DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: package

      - name: Verify the tarball is the one that was tested
        run: echo "$SHA256  package/$TARBALL" | sha256sum --check --strict

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports Trusted Publishing (>= 11.5.1)
        run: |
          version=$(npm --version)
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$version"; then
            npm install -g npm@11
          fi
          npm --version

      - name: Publish (OIDC, provenance generated automatically)
        run: npm publish "package/$TARBALL" --access public --tag "$DIST_TAG"

      - name: Verify the version is on the registry
        run: |
          for attempt in 1 2 3 4 5 6; do
            if [ "$(npm view "devzy@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "devzy@$VERSION is available."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::devzy@$VERSION was published but is not visible yet (registry propagation)."

      - name: Summary
        run: |
          {
            echo "### Published devzy@$VERSION"
            echo ""
            echo "- dist-tag: \`$DIST_TAG\`"
            echo "- tarball: \`$TARBALL\`"
            echo "- sha256: \`$SHA256\`"
            echo "- install: \`npm install -g devzy@$VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: Create GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: package

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
        run: |
          prerelease=""
          if [ "$DIST_TAG" != "latest" ]; then prerelease="--prerelease"; fi
          gh release create "$TAG" package/*.tgz --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease
